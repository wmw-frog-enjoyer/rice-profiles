format = """
[](#6F9F76)\
$directory\
[](fg:#6F9F76 bg:#29452F)\
$git_branch\
$git_status\
[](fg:#29452F bg:#6F9F76)\
$c\
$golang\
$nodejs\
$rust\
$python\
[](fg:#6F9F76 bg:#29452F)\
$time\
[ ](fg:#29452F)\
$character"""

command_timeout = 5000
add_newline = false

[directory]
style = "bg:#6F9F76 fg:#111A13"
format = "[ $path ]($style)"
truncation_length = 3

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bg:#29452F fg:#D0DDD1"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#29452F fg:#D0DDD1"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:#6F9F76 fg:#111A13"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#6F9F76 fg:#111A13"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#6F9F76 fg:#111A13"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:#6F9F76 fg:#111A13"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:#6F9F76 fg:#111A13"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#29452F fg:#D0DDD1"
format = '[ $time ]($style)'

[character]
success_symbol = "[❯](bold #6F9F76)"
error_symbol = "[❯](bold #fb4934)"
